appId: com.xuefengzhu.pullthread
name: Pullthread Milestone 3 campaign unlock and replay smoke
tags:
  - smoke
  - milestone-3
---
- launchApp:
    clearState: true

- assertVisible:
    id: "quilt-map-screen"
- assertVisible:
    id: "level-state-bedroom-01-first-pull"
    text: "CURRENT"
- assertVisible:
    id: "level-state-bedroom-02-edge-redirect"
    text: "LOCKED"
- tapOn:
    id: "level-node-bedroom-01-first-pull"

- assertVisible:
    id: "spike-level-screen"
- assertVisible:
    id: "tutorial-coachmark"
- assertVisible:
    id: "tutorial-step-title"
    text: "Pull the cloth"
- assertVisible:
    id: "stitch-count"
    text: ".*0.*"

# Start from the authored in-field guide, then use Maestro's element-relative
# directional swipe. The endpoint is clamped to the fabric, so device height
# and native safe-area differences cannot move the gesture out of the field.
- swipe:
    from:
      id: "tutorial-stitch-anchor"
    direction: UP
    duration: 800

- assertVisible:
    id: "stitch-count"
    text: ".*1.*"
- assertVisible:
    id: "tutorial-step-title"
    text: "Read the route"
- tapOn:
    id: "tutorial-next-button"
- assertVisible:
    id: "tutorial-step-title"
    text: "Let gravity work"
- tapOn:
    id: "release-button"

- extendedWaitUntil:
    visible:
      id: "results-button"
    timeout: 20000
- tapOn:
    id: "results-button"

- assertVisible:
    id: "results-screen"
- assertVisible:
    id: "thread-result"
- assertVisible:
    id: "stitches-result"
- assertVisible:
    id: "time-result"
- scrollUntilVisible:
    element:
      id: "watch-replay-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "watch-replay-button"
- scrollUntilVisible:
    element:
      id: "replay-stage"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "replay-stage"
      text: ".*REPLAY COMPLETE.*"
    timeout: 20000

- scrollUntilVisible:
    element:
      id: "results-map-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "results-map-button"
- assertVisible:
    id: "quilt-map-screen"
- assertVisible:
    id: "level-state-bedroom-01-first-pull"
    text: "COMPLETED"
- scrollUntilVisible:
    element:
      id: "level-state-bedroom-02-edge-redirect"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "level-state-bedroom-02-edge-redirect"
    text: "CURRENT"

# A default launch stops and relaunches the process without clearing storage.
# This proves campaign progress survives a native cold restart, not only
# navigation. Re-enter Level 1 to verify tutorial completion persisted too.
- stopApp
- launchApp
- assertVisible:
    id: "quilt-map-screen"
- scrollUntilVisible:
    element:
      id: "level-state-bedroom-02-edge-redirect"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "level-state-bedroom-02-edge-redirect"
    text: "CURRENT"
- scrollUntilVisible:
    element:
      id: "level-node-bedroom-01-first-pull"
    direction: UP
    timeout: 10000
- tapOn:
    id: "level-node-bedroom-01-first-pull"
- assertVisible:
    id: "spike-level-screen"
- assertNotVisible:
    id: "tutorial-coachmark"
