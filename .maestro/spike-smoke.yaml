appId: com.xuefengzhu.pullthread
name: Pullthread Milestone 2 tutorial, results, and replay smoke
tags:
  - smoke
  - milestone-2
---
- launchApp:
    clearState: true

- assertVisible:
    id: "spike-level-screen"
- assertVisible:
    id: "tutorial-coachmark"
- assertVisible:
    id: "tutorial-step-title"
    text: "Pull the cloth"
- assertVisible:
    id: "stitch-count"
    text: ".*0.*"

# Start from the authored in-field guide, then use Maestro's element-relative
# directional swipe. The endpoint is clamped to the fabric, so device height
# and native safe-area differences cannot move the gesture out of the field.
- swipe:
    from:
      id: "tutorial-stitch-anchor"
    direction: UP
    duration: 800

- assertVisible:
    id: "stitch-count"
    text: ".*1.*"
- assertVisible:
    id: "tutorial-step-title"
    text: "Read the route"
- tapOn:
    id: "tutorial-next-button"
- assertVisible:
    id: "tutorial-step-title"
    text: "Let gravity work"
- tapOn:
    id: "release-button"

- extendedWaitUntil:
    visible:
      id: "results-button"
    timeout: 20000
- tapOn:
    id: "results-button"

- assertVisible:
    id: "results-screen"
- assertVisible:
    id: "thread-result"
- assertVisible:
    id: "stitches-result"
- assertVisible:
    id: "time-result"
- tapOn:
    id: "watch-replay-button"
- extendedWaitUntil:
    visible:
      id: "replay-stage"
      text: ".*REPLAY COMPLETE.*"
    timeout: 20000

- tapOn:
    id: "try-again-button"
- assertVisible:
    id: "planning-status"
- assertVisible:
    id: "stitch-count"
    text: ".*0.*"
- assertNotVisible:
    id: "tutorial-coachmark"

# A default launch stops and relaunches the process without clearing storage.
# This proves completion survives a native cold restart, not only navigation.
- stopApp
- launchApp
- assertVisible:
    id: "spike-level-screen"
- assertNotVisible:
    id: "tutorial-coachmark"
