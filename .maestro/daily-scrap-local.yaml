appId: com.xuefengzhu.pullthread
name: Pullthread Daily Scrap local/offline route smoke
tags:
  - smoke
  - milestone-5
  - local-daily
---
# Run with EXPO_PUBLIC_DAILY_SERVICE=local. This route smoke is date-agnostic;
# deterministic completion and best persistence are covered by Jest because the
# authored Daily template rotates at 00:00 UTC.
- launchApp:
    clearState: true

- assertVisible:
    id: "quilt-map-screen"
- tapOn:
    id: "quilt-map-daily-scrap-button"

- assertVisible:
    id: "daily-scrap-screen"
- extendedWaitUntil:
    visible:
      id: "daily-scrap-play-button"
    timeout: 10000
- assertVisible:
    id: "daily-scrap-status"
    text: ".*LOCAL BOARD.*"
- assertVisible:
    id: "daily-scrap-personal-best"
- assertVisible:
    id: "daily-leaderboard-section"
- tapOn:
    id: "daily-scrap-play-button"

- assertVisible:
    id: "daily-level-screen"
- tapOn:
    id: "game-map-button"
- assertVisible:
    id: "daily-scrap-screen"
- tapOn:
    id: "daily-scrap-back-button"
- assertVisible:
    id: "quilt-map-screen"
