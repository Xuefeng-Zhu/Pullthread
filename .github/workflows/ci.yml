name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify immutable weekly ruleset
        run: node scripts/check-weekly-ruleset.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Export native bundles
        run: npm run export

  firebase-backend:
    name: Firebase function and Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked function dependencies
        run: npm ci --prefix functions

      - name: Test callable validation, transactions, and security rules
        run: npm test --prefix functions

  workers-backend:
    name: Workers API and D1 transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install locked Worker dependencies
        run: npm ci --prefix worker

      - name: Verify API authentication and real D1 transactions
        run: npm test --prefix worker

      - name: Bundle Worker without deploying
        run: npm run build --prefix worker
